<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Seguimiento | Inkafarma</title><link rel="stylesheet" href="/assets/styles.css"><link rel="stylesheet" href="/assets/pedido.css"><script src="/assets/seguimiento.js" defer></script><style>#tracking-code{width:100%;padding:14px;border:1px solid #a9ceba;border-radius:8px;font-size:16px}#tracking-form p{color:#62746e;line-height:1.6}#tracking-state{font-size:24px;color:#087c49;font-weight:bold}#tracking-history{padding-left:24px}#tracking-history li{padding:12px 5px;border-bottom:1px solid #dce8e1}.header-inner h1{font-size:22px}.header-inner a{color:#05643a}@media(max-width:570px){.header-inner{flex-wrap:wrap}}</style></head>
<body><header class="top"><div class="header-inner"><h1>Seguimiento de tu pedido</h1><a href="/">Volver al catálogo</a></div></header><main class="shell">
<p>Consulta el estado y los cambios registrados de tu pedido.</p>
<form class="controls" id="tracking-form"><label for="tracking-code">Código de seguimiento</label><input id="tracking-code" required maxlength="64" autocomplete="off" spellcheck="false" placeholder="WEB-…"><p>Guarda este código y compártelo solo con personas de confianza.</p><button class="action" id="tracking-button">Consultar seguimiento</button></form>
<p id="tracking-message" role="status" aria-live="polite"></p>
<section class="controls" id="tracking-result" hidden aria-labelledby="tracking-title"><h2 id="tracking-title">Tu pedido</h2><p id="tracking-state"></p><p id="tracking-description"></p><p id="tracking-branch"></p><h3>Historial del pedido</h3><ol id="tracking-history"></ol><p>Fechas en hora de Lima. Pulsa «Consultar seguimiento» para actualizar.</p></section>
</main></body></html>
